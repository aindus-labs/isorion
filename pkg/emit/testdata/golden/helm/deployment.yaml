{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/managed-by: isorion-helm
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $svc.image | quote }}
          {{- with $svc.command }}
          command: {{ toJson . }}
          {{- end }}
          {{- with $svc.ports }}
          ports:
            {{- range . }}
            - containerPort: {{ .container }}
              {{- if .protocol }}
              protocol: {{ .protocol }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- with $svc.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              {{- if kindIs "map" $v }}
              valueFrom:
                secretKeyRef:
                  name: {{ $v.secretKeyRef.name }}
                  key: {{ $v.secretKeyRef.key }}
              {{- else }}
              value: {{ $v | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
---
{{- end }}
