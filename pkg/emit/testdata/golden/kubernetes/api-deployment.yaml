apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/managed-by: isorion
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: webapp
    name: api
spec:
    replicas: 5
    selector:
        matchLabels:
            app.kubernetes.io/name: api
    template:
        metadata:
            labels:
                app.kubernetes.io/managed-by: isorion
                app.kubernetes.io/name: api
                app.kubernetes.io/part-of: webapp
        spec:
            containers:
                - env:
                    - name: APP_ENV
                      value: production
                  image: nginx:1.25
                  name: api
                  ports:
                    - containerPort: 8080
                      protocol: TCP
