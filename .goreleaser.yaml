version: 2

project_name: isorion

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...

builds:
  - id: isorion
    main: ./cmd/isorion
    binary: isorion
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  use: github-native

release:
  draft: false
  name_template: "isorion {{ .Version }}"
